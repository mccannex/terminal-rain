# Matrix screensaver config. One key=value per line, '#' starts a comment.
# Deployed as matrix.cfg next to the executable on first build only -- edit
# matrix.cfg directly to tune; this template won't overwrite your changes.

# Max number of concurrently active streams.
MaxStream=3000

# Rows behind a stream's head guaranteed to be fully erased.
BackTrace=200

# Min rows behind the head before the random erase point can happen.
Leading=100

# Range added to Leading for the random erase point.
SpacePad=30

# Max ticks a stream can wait between row-advances (higher = slower streams possible).
SpeedDelay=10

# Base head color.
ColorR=150
ColorG=255
ColorB=125
