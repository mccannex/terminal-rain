name: Release builds

# Tag push (v*) publishes a GitHub Release with all three platform artifacts
# attached. workflow_dispatch lets the matrix be run/inspected without
# cutting a real tag first.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # SDL2 is fetched fresh via CMake FetchContent (see CMakeLists.txt) --
      # cached by SDL2's pinned git tag + OS so repeat runs skip re-cloning
      # and rebuilding it from scratch.
      - uses: actions/cache@v4
        with:
          path: build/_deps
          key: ${{ runner.os }}-sdl2-deps-release-2.30.9

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build --config Release --target terminal_rain

      - uses: actions/upload-artifact@v4
        with:
          name: Terminal Rain-windows
          path: build/Release/Terminal Rain.scr

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Package names per platform/linux/AGENT_CONTEXT.md's dnf list,
      # translated to their apt equivalents (X11 *and* Wayland dev headers --
      # that doc notes SDL2 has silently built with every video driver off
      # before from a missing-headers gap).
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols libegl1-mesa-dev libgl1-mesa-dev libdrm-dev

      - uses: actions/cache@v4
        with:
          path: build/_deps
          key: ${{ runner.os }}-sdl2-deps-release-2.30.9

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      # A bare executable, not a package: the Fedora/KDE integration points
      # powerdevil's idle-script hook straight at it (see
      # platform/linux/AGENT_CONTEXT.md).
      - name: Build
        run: cmake --build build --target terminal_rain

      - uses: actions/upload-artifact@v4
        with:
          name: Terminal Rain-linux
          path: build/terminal-rain

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: build/_deps
          key: ${{ runner.os }}-sdl2-deps-release-2.30.9

      # Universal (arm64 + x86_64) so Intel Macs can load the bundle too.
      # The runner is Apple Silicon; the x86_64 slice is cross-compiled and
      # has never been run on real Intel hardware.
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        run: cmake --build build --target terminal_rain_saver

      # Same ad-hoc
      # codesign POST_BUILD step as local dev builds (see CMakeLists.txt);
      # no paid Apple Developer identity or notarization involved here (a
      # deliberate choice, see platform/macos/AGENT_CONTEXT.md). A browser
      # download of this zip gets tagged com.apple.quarantine, which
      # Gatekeeper then refuses to open at all for an ad-hoc-signed bundle --
      # .github/RELEASE_NOTES.md's install command routes around this by
      # having users curl the asset directly instead (curl never sets the
      # quarantine flag in the first place, so there's nothing to strip).
      #
      # ditto (not zip) preserves the .saver bundle's code signature and
      # extended attributes correctly -- Apple's documented way to compress
      # a bundle for distribution. --keepParent keeps "Terminal Rain.saver" as
      # the archived folder itself, not its contents dumped at the zip root.
      - name: Package bundle
        run: ditto -c -k --sequesterRsrc --keepParent "build/Terminal Rain.saver" "Terminal Rain-macOS.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Terminal Rain-macos
          path: Terminal Rain-macOS.zip

  release:
    needs: [windows, linux, macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4

      # .github/RELEASE_NOTES.md carries the actual install instructions --
      # in particular the macOS curl-instead-of-browser-download command,
      # and why (see platform/macos/AGENT_CONTEXT.md's "Distribution"
      # section for the full story). Without this, a normal user downloading
      # the zip through their browser hits a misleading "damaged" error with
      # no obvious next step.
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          body_path: .github/RELEASE_NOTES.md
          files: |
            Terminal Rain-windows/**
            Terminal Rain-linux/**
            Terminal Rain-macos/**
